<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Wind Turbine Monitor</title>
<style>
  body {
    font-family: Arial, sans-serif; color:#fff; text-align:center;
    margin:0; padding:20px; min-height:100vh;
    background-color:#111;
    background-size:cover; background-position:center; background-attachment:fixed;
    transition: background-image 0.5s;
  }
  #status { font-size:28px; font-weight:bold; padding:30px 10px; border-radius:16px;
            margin:20px auto; max-width:500px; backdrop-filter: blur(4px); }
  .fine { background:rgba(27,138,58,0.85); }
  .thor { background:rgba(106,27,184,0.85); }
  .stop { background:rgba(192,57,43,0.85); }
  .off  { background:rgba(85,85,85,0.85); }
  .box  { display:inline-block; margin:10px; padding:15px 25px; background:rgba(0,0,0,0.65);
          border-radius:12px; font-size:22px; }
  h1, small { text-shadow: 0 2px 6px #000; }
  small { color:#ddd; }
  #soundBtn { margin-top:10px; padding:12px 24px; font-size:18px; border:none;
              border-radius:10px; background:#2980b9; color:#fff; cursor:pointer; }
  #soundBtn.on { background:#1b8a3a; }

  .ctrl { margin:20px auto; padding:15px; max-width:500px; background:rgba(0,0,0,0.65);
          border-radius:12px; }
  .ctrl button { margin:6px; padding:16px 28px; font-size:20px; font-weight:bold; border:none;
                 border-radius:12px; color:#fff; cursor:pointer; }
  #btnStop { background:#c0392b; }
  #btnOn   { background:#1b8a3a; }
  .ctrl button:disabled { opacity:0.5; cursor:wait; }
</style>
</head>
<body>
  <h1>Wind Turbine Monitor</h1>
  <div id="status" class="off">Loading...</div>
  <div class="box">Voltage<br><span id="v">--</span> V</div>
  <div class="box">RPM<br><span id="r">--</span></div>
  <div class="box">Brake<br><span id="brk">--</span></div>
  <p><small id="t">--</small></p>

  <div class="ctrl">
    <div>Turbine Control</div>
    <button id="btnStop">⏹ Turbine Stop</button>
    <button id="btnOn">▶ Turbine On</button>
    <div><small id="cmdMsg">Ready - no command sent yet</small></div>
  </div>

  <button id="soundBtn">🔇 Tap to enable sound</button>
  <p><small>page version v6</small></p>

<script>
// ===== Your channel details =====
const CHANNEL_ID = "3568547";
const READ_KEY   = "6MGEE2L6J8ESTBS9";
// ===== TalkBack (button control) =====
const TB_ID  = "58278";
const TB_KEY = "XIJ00SEU9TLKEFOE";
// ===== Thresholds =====
const FINE_VOLT = 1.0;    // above this = "Turbine is fine"
const THOR_RPM  = 10;
const THOR_VOLT = 25;     // above this (with RPM) = Thor
const STALE_SEC = 60;

// ===== Background GIF for each state =====
const BG = {
  fine: "fine.gif",
  thor: "thor.gif",
  stop: "stop.gif",
  off:  "off.gif",
  low:  "low.gif"
};

// ===== Sound for each state =====
const SND = {
  fine: new Audio("fine.mp3"),
  thor: new Audio("thor.mp3"),
  stop: new Audio("stop.mp3"),
  off:  new Audio("off.mp3"),
  low:  new Audio("low.mp3")
};

// ===== Sounds for the brake buttons and ESP32 confirmation =====
// (if your files are .wav, change the extension here)
const EVT = {
  engaging:    new Audio("brake_engaging.mp3"),      // Turbine Stop pressed
  disengaging: new Audio("brake_disengaging.mp3"),   // Turbine On pressed
  engagedOk:   new Audio("engaging_confirmed.mp3"),  // ESP32 confirmed brake applied
  disengagedOk:new Audio("disengaging_confirmed.mp3")// ESP32 confirmed brake released
};

const ALL_AUDIO = [...Object.values(SND), ...Object.values(EVT)];
ALL_AUDIO.forEach(a => { a.preload = "auto"; });

Object.values(BG).forEach(src => { const i = new Image(); i.src = src; });

// ===== Turbine Stop / Turbine On buttons =====
// Turbine Stop -> sends "ON"  (servo turns 40 degrees = brake)
// Turbine On   -> sends "OFF" (servo returns home = brake released)
let expectedBrake = null;
let esp32Online = false;   // updated by update()
let cmdSentAt = 0;         // time the last command was sent
let cmdTimer = null;

async function sendCommand(cmd, label) {
  const msg   = document.getElementById("cmdMsg");
  const bStop = document.getElementById("btnStop");
  const bOn   = document.getElementById("btnOn");

  // Block the command if the ESP32 is offline
  if (!esp32Online) {
    expectedBrake = null;
    msg.textContent = "⚠️ Turbine offline - cannot send the command";
    if (soundOn) { stopAllSounds(); SND.off.play().catch(() => {}); }
    return;
  }

  expectedBrake = (cmd === "ON") ? 1 : 0;
  cmdSentAt = Date.now();
  bStop.disabled = bOn.disabled = true;
  msg.textContent = "Sending...";

  // play "brake engaging" or "brake disengaging" as soon as the button is pressed
  playEvent(cmd === "ON" ? "engaging" : "disengaging");

  try {
    await fetch(`https://api.thingspeak.com/talkbacks/${TB_ID}/commands`, {
      method: "POST",
      mode: "no-cors",
      body: new URLSearchParams({ api_key: TB_KEY, command_string: cmd })
    });
    msg.textContent = label + " sent. Waiting for ESP32 confirmation...";

    // If no confirmation within 40 seconds, report it
    clearTimeout(cmdTimer);
    cmdTimer = setTimeout(() => {
      if (expectedBrake !== null) {
        msg.textContent = "⚠️ No confirmation from ESP32 - turbine may be offline";
        expectedBrake = null;
      }
    }, 40000);
  } catch (err) {
    msg.textContent = "Could not send command";
    expectedBrake = null;
  }
  setTimeout(() => { bStop.disabled = bOn.disabled = false; }, 3000);
}
document.getElementById("btnStop").addEventListener("click", () => sendCommand("ON", "Turbine STOP"));
document.getElementById("btnOn").addEventListener("click",   () => sendCommand("OFF", "Turbine ON"));

// Browsers block sound until the visitor taps the page once
let soundOn = false;
const btn = document.getElementById("soundBtn");
btn.addEventListener("click", () => {
  soundOn = !soundOn;
  if (soundOn) {
    ALL_AUDIO.forEach(a => {
      a.muted = true;
      a.play().then(() => { a.pause(); a.currentTime = 0; a.muted = false; })
              .catch(() => { a.muted = false; });
    });
    btn.textContent = "🔊 Sound on (tap to mute)";
    btn.classList.add("on");
  } else {
    stopAllSounds();
    btn.textContent = "🔇 Tap to enable sound";
    btn.classList.remove("on");
  }
});

function stopAllSounds() {
  ALL_AUDIO.forEach(a => { a.pause(); a.currentTime = 0; });
}

function playSound(state) {
  if (!soundOn) return;
  stopAllSounds();
  if (SND[state]) SND[state].play().catch(() => {});
}

function playEvent(name) {
  if (!soundOn) return;
  stopAllSounds();
  if (EVT[name]) EVT[name].play().catch(() => {});
}

let currentState = "";
function setState(state, cssClass, text) {
  const el = document.getElementById("status");
  el.className = cssClass;
  el.textContent = text;
  if (state !== currentState) {
    currentState = state;
    document.body.style.backgroundImage =
      `linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)), url('${BG[state]}')`;
    playSound(state);
  }
}

async function update() {
  try {
    let url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json?t=${Date.now()}`;
    if (READ_KEY) url += `&api_key=${READ_KEY}`;
    const d = await (await fetch(url)).json();

    const volt = parseFloat(d.field1) || 0;
    const rpm  = parseFloat(d.field2) || 0;
    const age  = (Date.now() - new Date(d.created_at)) / 1000;
    esp32Online = age <= STALE_SEC;

    // ----- Brake state from the ESP32 (field 3) -----
    const brake = (d.field3 === null || d.field3 === undefined) ? null : parseFloat(d.field3);
    const brkEl = document.getElementById("brk");
    if (brake === null) {
      brkEl.textContent = "--";
    } else {
      brkEl.textContent = brake === 1 ? "Applied" : "Released";
    }

    // Confirm only with a FRESH reading uploaded after the command was sent
    const entryTime = new Date(d.created_at).getTime();
    if (expectedBrake !== null && age <= STALE_SEC &&
        entryTime > cmdSentAt && brake === expectedBrake) {
      clearTimeout(cmdTimer);
      document.getElementById("cmdMsg").textContent =
        (brake === 1 ? "✅ Brake applied (confirmed by ESP32)"
                     : "✅ Brake released (confirmed by ESP32)");
      // play "engaging confirmed" or "disengaging confirmed"
      playEvent(brake === 1 ? "engagedOk" : "disengagedOk");
      expectedBrake = null;
    }

    document.getElementById("v").textContent = volt.toFixed(2);
    document.getElementById("r").textContent = rpm.toFixed(0);
    document.getElementById("t").textContent = "Last update: " + new Date(d.created_at).toLocaleString();

    if (age > STALE_SEC) {
      setState("off", "off", "ESP32 offline (no new data)");
    } else if (rpm === 0) {
      setState("stop", "stop", "Something has happened, turbine stopped!");
    } else if (rpm >= THOR_RPM && volt > THOR_VOLT) {
      setState("thor", "thor", "I am Thor ⚡");
    } else if (volt > FINE_VOLT) {
      setState("fine", "fine", "Turbine is fine");
    } else {
      setState("low", "fine", "Rotating, low voltage");
    }
  } catch (e) {
    esp32Online = false;
    console.error("update() failed:", e);
    setState("off", "off", "ESP32 offline (no new data)");
  }
}
update();
setInterval(update, 15000);
</script>
</body>
</html>
