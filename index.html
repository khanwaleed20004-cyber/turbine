<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wind Turbine Monitor</title>
<style>
  body {
    font-family: Arial, sans-serif; color:#fff; text-align:center;
    margin:0; padding:20px; min-height:100vh;
    background-color:#111;
    background-size:cover; background-position:center; background-attachment:fixed;
    transition: background-image 0.5s;
  }
  #status { font-size:28px; font-weight:bold; padding:30px 10px; border-radius:16px;
            margin:20px auto; max-width:500px; backdrop-filter: blur(4px); }
  .fine { background:rgba(27,138,58,0.85); }
  .thor { background:rgba(106,27,184,0.85); }
  .stop { background:rgba(192,57,43,0.85); }
  .off  { background:rgba(85,85,85,0.85); }
  .box  { display:inline-block; margin:10px; padding:15px 25px; background:rgba(0,0,0,0.65);
          border-radius:12px; font-size:22px; }
  h1, small { text-shadow: 0 2px 6px #000; }
  small { color:#ddd; }
  #soundBtn { margin-top:10px; padding:12px 24px; font-size:18px; border:none;
              border-radius:10px; background:#2980b9; color:#fff; cursor:pointer; }
  #soundBtn.on { background:#1b8a3a; }
</style>
</head>
<body>
  <h1>Wind Turbine Monitor</h1>
  <div id="status" class="off">Loading...</div>
  <div class="box">Voltage<br><span id="v">--</span> V</div>
  <div class="box">RPM<br><span id="r">--</span></div>
  <p><small id="t">--</small></p>
  <button id="soundBtn">🔇 Tap to enable sound</button>

<script>
// ===== Your channel details =====
const CHANNEL_ID = "3568547";
const READ_KEY   = "6MGEE2L6J8ESTBS9";
// ===== Thresholds =====
const FINE_VOLT = 1.3;
const THOR_RPM  = 50;
const THOR_VOLT = 5;
const STALE_SEC = 60;

// ===== Background GIF for each state =====
const BG = {
  fine: "fine.gif",
  thor: "thor.gif",
  stop: "stop.gif",
  off:  "off.gif",
  low:  "low.gif"
};

// ===== Sound for each state =====
const SND = {
  fine: new Audio("fine.mp3"),
  thor: new Audio("thor.mp3"),
  stop: new Audio("stop.mp3"),
  off:  new Audio("off.mp3"),
  low:  new Audio("low.mp3")
};
Object.values(SND).forEach(a => { a.preload = "auto"; });

// Load all GIFs once so they switch instantly
Object.values(BG).forEach(src => { const i = new Image(); i.src = src; });

// Browsers block sound until the visitor taps the page once
let soundOn = false;
const btn = document.getElementById("soundBtn");
btn.addEventListener("click", () => {
  soundOn = !soundOn;
  if (soundOn) {
    // unlock every audio file with a silent play
    Object.values(SND).forEach(a => {
      a.muted = true;
      a.play().then(() => { a.pause(); a.currentTime = 0; a.muted = false; })
              .catch(() => { a.muted = false; });
    });
    btn.textContent = "🔊 Sound on (tap to mute)";
    btn.classList.add("on");
  } else {
    Object.values(SND).forEach(a => { a.pause(); a.currentTime = 0; });
    btn.textContent = "🔇 Tap to enable sound";
    btn.classList.remove("on");
  }
});

function playSound(state) {
  if (!soundOn) return;
  Object.values(SND).forEach(a => { a.pause(); a.currentTime = 0; });
  if (SND[state]) SND[state].play().catch(() => {});
}

let currentState = "";
function setState(state, cssClass, text) {
  const el = document.getElementById("status");
  el.className = cssClass;
  el.textContent = text;
  if (state !== currentState) {
    currentState = state;
    document.body.style.backgroundImage =
      `linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)), url('${BG[state]}')`;
    playSound(state);   // plays only when the state changes
  }
}

async function update() {
  try {
    let url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json`;
    if (READ_KEY) url += `?api_key=${READ_KEY}`;
    const d = await (await fetch(url)).json();

    const volt = parseFloat(d.field1) || 0;
    const rpm  = parseFloat(d.field2) || 0;
    const age  = (Date.now() - new Date(d.created_at)) / 1000;

    document.getElementById("v").textContent = volt.toFixed(2);
    document.getElementById("r").textContent = rpm.toFixed(0);
    document.getElementById("t").textContent = "Last update: " + new Date(d.created_at).toLocaleString();

    if (age > STALE_SEC) {
      setState("off", "off", "ESP32 offline (no new data)");
    } else if (rpm === 0) {
      setState("stop", "stop", "Something has happened, turbine stopped!");
    } else if (rpm >= THOR_RPM && volt >= THOR_VOLT) {
      setState("thor", "thor", "I am Thor ⚡");
    } else if (volt > FINE_VOLT) {
      setState("fine", "fine", "Turbine is fine");
    } else {
      setState("low", "fine", "Rotating, low voltage");
    }
  } catch (e) {
    setState("off", "off", "Cannot read ThingSpeak");
  }
}
update();
setInterval(update, 15000);
</script>
</body>
</html>
